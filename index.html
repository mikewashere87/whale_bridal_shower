<!DOCTYPE html>
<html>

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Whale's Bridal Shower 2015</title>

        <style>
.inline {

    display: inline-block;
    cursor: pointer;

}

.absolute {

    position: absolute;
    cursor: pointer;
    transition: transform 1000ms ease;
    will-change: transform;

}

@media (prefers-reduced-motion: reduce) {
  .absolute { transition: none; }
}

body {

    margin: 0;
    font-size: 4vw;
    cursor: pointer;

}

.outer {
    display: table;
    position: absolute;
    height: 100%;
    width: 100%;
    cursor: pointer;
}

.middle {
    display: table-cell;
    vertical-align: middle;
    cursor: pointer;
}

.inner {
    margin-left: auto;
    margin-right: auto;
    width: 90%;
    cursor: pointer;
}
        </style>
        <link rel="preload" href="bday.js" as="script" />
        <script src="bday.js" defer></script>

    </head>

    <body>
        <div class="outer">
            <div class="middle">
                <div class="inner">
                </div>
            </div>
        </div>
    </body>

</html>
